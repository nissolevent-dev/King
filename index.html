<title>King Skor Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D2818;
    --felt:#153623;
    --felt-light:#1B4332;
    --ivory:#F7F3E9;
    --ivory-dim:#EAE4D3;
    --ink:#1A1A2E;
    --gold:#C9A227;
    --gold-light:#E4C767;
    --crimson:#A8322D;
    --crimson-light:#D4645C;
    --muted:#8FA396;
    --line: rgba(247,243,233,0.12);
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;
    background:radial-gradient(ellipse at top, var(--felt-light) 0%, var(--bg) 65%);
    background-attachment:fixed;
    color:var(--ivory);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px 0;}

  header{text-align:center;padding:18px 0 10px;}
  .kingmark{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:700;font-size:44px;letter-spacing:1px;color:var(--gold-light);margin:0;}
  .suitrow{letter-spacing:10px;font-size:15px;color:var(--muted);margin:4px 0 2px;}
  .subtitle{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:500;}

  .section-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--ivory);margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
  .section-title .rule{flex:1;height:1px;background:var(--line);}
  .section-title .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);font-weight:400;}

  /* ---- Roster ---- */
  .roster-card{background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .roster-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .roster-chip{
    display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
    border-radius:20px;padding:6px 6px 6px 12px;font-size:13px;
  }
  .roster-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;
    width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .roster-chip button:hover{color:var(--crimson-light);background:rgba(168,50,45,0.15);}
  .roster-empty{color:var(--muted);font-size:12px;margin-bottom:10px;}
  .roster-add{display:flex;gap:8px;}
  .roster-add input{
    flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ivory);
    padding:9px 12px;font-family:'Work Sans';font-size:16px;
  }
  .roster-add input:focus{outline:none;border-color:var(--gold);}
  .roster-add button{background:var(--gold);color:var(--ink);border:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;}

  /* ---- Setup wizard ---- */
  .setup-card{background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .step-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;}
  .step-label:first-child{margin-top:0;}
  .choice-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .choice-btn{
    background:var(--bg);border:1px solid var(--line);color:var(--ivory-dim);border-radius:8px;
    padding:9px 12px;font-size:13px;cursor:pointer;font-family:'Work Sans';display:flex;align-items:center;gap:6px;
  }
  .choice-btn .icon{font-size:14px;}
  .choice-btn small{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;}
  .choice-btn.selected{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600;}
  .choice-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .seat-btn{position:relative;font-size:17px;font-weight:600;padding:12px 16px;}

  .type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:stretch;}
  .type-btn{
    background:var(--bg);border:1px solid var(--line);color:var(--ivory-dim);border-radius:8px;
    padding:12px 10px;font-size:15px;cursor:pointer;font-family:'Work Sans';font-weight:500;
    display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;
    height:100%;align-self:stretch;box-sizing:border-box;
  }
  .type-btn .icon{font-size:16px;}
  .type-btn small{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;}
  .type-btn.selected{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700;}
  .type-btn.selected small{color:var(--ink);opacity:0.7;}
  .type-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .type-btn.koz-pill{grid-column:1/-1;width:50%;margin:0 auto;}
  .seat-badge{
    position:absolute;top:-7px;right:-7px;background:var(--gold);color:var(--ink);
    width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
  }
  .setup-hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .panel-actions{display:flex;gap:8px;margin-top:16px;}
  .btn-primary{flex:1;background:var(--gold);color:var(--ink);border:none;border-radius:8px;padding:11px;font-weight:700;cursor:pointer;font-family:'Work Sans';}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;}
  .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:11px 16px;cursor:pointer;font-family:'Work Sans';}

  /* ---- Active session bar ---- */
  .session-bar{display:flex;justify-content:space-between;align-items:center;background:var(--felt);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:12px;color:var(--muted);}
  .session-bar b{color:var(--gold-light);font-family:'JetBrains Mono',monospace;}
  .session-bar button{background:none;border:1px solid var(--line);color:var(--crimson-light);border-radius:6px;
    padding:6px 10px;cursor:pointer;font-size:11px;}

  /* ---- Players / scoreboard ---- */
  .players-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0;}
  .player-card{background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;position:relative;}
  .player-card .pname{font-size:13px;font-weight:600;color:var(--ivory);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .player-total{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;margin-top:6px;color:var(--ivory);cursor:pointer;}
  .player-total.neg{color:var(--crimson-light);}
  .player-total.pos{color:var(--gold-light);}
  .player-total-split{display:flex;flex-direction:row;gap:10px;justify-content:center;align-items:baseline;margin-top:10px;cursor:pointer;}
  .player-total-split .plus{color:var(--gold-light);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;}
  .player-total-split .minus{color:var(--crimson-light);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;}
  .player-rights{font-size:14px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
  .player-rights b{font-size:16px;color:var(--ivory-dim);}
  .next-chooser{text-align:center;font-size:13px;color:var(--gold-light);margin-top:4px;}
  .next-chooser b{font-family:'Fraunces',serif;}

  .quota-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:22px 0 8px;}
  .quota-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .quota-pill{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--felt);border:1px solid var(--line);
    border-radius:20px;padding:7px 8px;font-size:12px;color:var(--ivory-dim);text-align:center;}
  .quota-pill.koz-pill{grid-column:2;}
  .quota-pill .icon{font-size:13px;}
  .quota-pill.done{
    border-color:var(--gold);color:var(--gold-light);opacity:0.85;position:relative;overflow:hidden;
    background-image:linear-gradient(to top right, transparent calc(50% - 1px), var(--gold) calc(50% - 1px), var(--gold) calc(50% + 1px), transparent calc(50% + 1px));
  }
  .quota-pill b{font-family:'JetBrains Mono',monospace;font-weight:700;}

  .add-btn{width:100%;margin-top:20px;padding:14px;border:none;border-radius:10px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    color:var(--ink);font-family:'Fraunces',serif;font-weight:700;font-size:16px;letter-spacing:.5px;cursor:pointer;}
  .add-btn:hover{filter:brightness(1.05);}
  .table-btn{width:100%;margin-top:10px;padding:12px;border:1px solid var(--gold);border-radius:10px;
    background:transparent;color:var(--gold-light);font-family:'Work Sans';font-weight:600;font-size:14px;cursor:pointer;}
  .table-btn:hover{background:rgba(201,162,39,0.1);}
  .hand-progress{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;font-family:'JetBrains Mono',monospace;}

  .panel{background:var(--felt);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px;animation:fadein .18s ease-out;}
  @keyframes fadein{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .panel h3{font-family:'Fraunces',serif;font-size:16px;margin:0 0 4px;color:var(--gold-light);font-weight:600;}
  .panel .chooser-note{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .panel .chooser-note b{color:var(--ivory-dim);}

  .dist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
  .dist-cell{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;}
  .dist-cell label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dist-cell input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    color:var(--gold-light);font-family:'JetBrains Mono',monospace;font-size:18px;text-align:center;padding:4px 0;}
  .dist-cell input:focus{outline:none;border-bottom:1px solid var(--gold);}
  .dist-sum{font-size:12px;text-align:right;margin-top:6px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .dist-sum.ok{color:var(--gold-light);}
  .dist-sum.bad{color:var(--crimson-light);}

  .rifki-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
  .rifki-btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 6px;text-align:center;
    color:var(--ivory-dim);cursor:pointer;font-size:13px;}
  .rifki-btn.selected{background:var(--crimson);border-color:var(--crimson-light);color:var(--ivory);font-weight:600;}

  .empty-note{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;}
  .hand-row{background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .hand-row.rifki-row{border-color:rgba(201,162,39,0.5);box-shadow:0 0 12px rgba(201,162,39,0.08) inset;}
  .hand-row.cancelled-row{opacity:0.65;border-style:dashed;}
  .cancel-tag{background:var(--crimson);color:var(--ivory);font-size:10px;padding:2px 7px;border-radius:10px;margin-left:2px;font-weight:600;}
  .cancel-note{font-size:11px;color:var(--muted);margin-top:6px;text-align:center;}
  .hand-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .hand-meta{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;}
  .hand-num{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;}
  .hand-type{font-weight:600;color:var(--ivory);display:flex;align-items:center;gap:5px;}
  .hand-chooser{color:var(--muted);font-size:12px;}
  .hand-actions button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;}
  .hand-actions button:hover{color:var(--crimson-light);}
  .hand-breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .bd-cell{font-size:12px;text-align:center;background:var(--bg);border-radius:6px;padding:5px 2px;}
  .bd-cell .name{color:var(--muted);font-size:10px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bd-cell .val{font-family:'JetBrains Mono',monospace;font-weight:600;}
  .bd-cell .score{font-family:'JetBrains Mono',monospace;font-size:11px;display:block;}
  .score.neg{color:var(--crimson-light);}
  .score.pos{color:var(--gold-light);}
  .score.zero{color:var(--muted);}

  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:36px;padding:0 16px;}

  /* ---- Score table modal ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
    animation:fadein .15s ease-out;
  }
  .modal-box{
    background:var(--felt);border:1px solid var(--line);border-radius:14px 14px 0 0;
    width:100%;max-width:920px;max-height:82vh;display:flex;flex-direction:column;
  }
  @media (min-width:640px){
    .modal-overlay{align-items:center;}
    .modal-box{border-radius:14px;max-height:80vh;}
  }
  .modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);}
  .modal-header h3{margin:0;font-family:'Fraunces',serif;font-size:17px;color:var(--gold-light);font-weight:600;}
  .modal-header button{background:none;border:1px solid var(--line);color:var(--ivory-dim);border-radius:6px;
    width:30px;height:30px;cursor:pointer;font-size:14px;}
  .modal-body{overflow:auto;padding:8px 12px 16px;}
  .score-table{width:100%;border-collapse:collapse;font-size:12px;}
  .score-table th{position:sticky;top:0;background:var(--felt);text-align:center;padding:8px 6px;
    font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;}
  .score-table th:first-child, .score-table td:first-child{text-align:left;padding-left:4px;}
  .score-table td{text-align:center;padding:7px 6px;font-family:'JetBrains Mono',monospace;border-bottom:1px solid rgba(247,243,233,0.06);white-space:nowrap;}
  .score-table td.htype{font-family:'Work Sans';text-align:left;color:var(--ivory-dim);}
  .score-table td.hicon{font-size:13px;margin-right:3px;}
  .score-table td.pos{color:var(--gold-light);}
  .score-table td.neg{color:var(--crimson-light);}
  .score-table td.zero{color:var(--muted);}
  .score-table tr.total-row td{border-top:2px solid var(--gold);border-bottom:none;font-weight:700;padding-top:10px;color:var(--ivory);}
  .score-table tr.total-row td.pos{color:var(--gold-light);}
  .score-table tr.total-row td.neg{color:var(--crimson-light);}

  @media (max-width:560px){
    .players-row{grid-template-columns:repeat(2,1fr);}
    .stat-cards{grid-template-columns:repeat(2,1fr);}
    .kingmark{font-size:34px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="suitrow">♠ ♥ ♦ ♣</div>
    <h1 class="kingmark">KING</h1>
    <p class="subtitle">Skor Takip</p>
  </header>

  <div class="section-title"><span>Oyuncular</span><div class="rule"></div></div>
  <div class="roster-card">
    <div class="roster-chips" id="rosterChips"></div>
    <div class="roster-add">
      <input type="text" id="newPlayerInput" placeholder="Yeni oyuncu adı" maxlength="20"/>
      <button id="addPlayerBtn">Ekle</button>
    </div>
  </div>

  <div id="setupHost"></div>
  <div id="sessionBarHost"></div>

  <div id="gameHost"></div>
  <div id="modalHost"></div>

</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "king-skor-defteri-v2";
  const OLD_STORAGE_KEY = "king-skor-defteri-v1";
  const PLAYER_COLORS = ["#E4C767","#D4645C","#7FB8A0","#8FA3D8"];

  const CEZA_TYPES = [
    {id:"kupa",   name:"Kupa Almaz",    icon:"♥", units:13, per:-30,  unitLabel:"kupa"},
    {id:"kiz",    name:"Kız Almaz",     icon:"♛", units:4,  per:-100, unitLabel:"kız"},
    {id:"erkek",  name:"Erkek Almaz",   icon:"♚", units:8,  per:-60,  unitLabel:"erkek (K/V)"},
    {id:"el",     name:"El Almaz",      icon:"✋", units:13, per:-50,  unitLabel:"el"},
    {id:"sonIki", name:"Son İki Almaz", icon:"⏳", units:2,  per:-180, unitLabel:"el"},
    {id:"rifki",  name:"Rıfkı Almaz",   icon:"👑", units:1,  per:-320, unitLabel:"kupa papazı"},
  ];
  const KOZ_TYPE = {id:"koz", name:"Koz", icon:"♠", units:13, per:50, unitLabel:"el"};
  const ALL_TYPES = [...CEZA_TYPES, KOZ_TYPE];
  const TOTAL_HANDS = 20;
  const CEZA_QUOTA_PER_PLAYER = 3;
  const KOZ_QUOTA_PER_PLAYER = 2;

  function typeInfo(id){ return ALL_TYPES.find(t=>t.id===id); }
  function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---- State ----
  function defaultState(){ return { roster: [], session: null }; }
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed.roster) return parsed;
      }
      // migrate from v1 (flat player list, no roster) if present
      const old = localStorage.getItem(OLD_STORAGE_KEY);
      if(old){
        const p = JSON.parse(old);
        if(p.players){
          return { roster: p.players.map(name=>({id:uid(), name})), session: null };
        }
      }
    }catch(e){}
    return defaultState();
  }
  let state = loadState();
  function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function rosterName(id){
    const r = state.roster.find(p=>p.id===id);
    return r ? r.name : "?";
  }

  // ==================================================
  // ROSTER
  // ==================================================
  function renderRoster(){
    const host = document.getElementById("rosterChips");
    if(state.roster.length===0){
      host.innerHTML = `<div class="roster-empty">Henüz oyuncu eklenmedi. Aşağıdan ekleyerek başla.</div>`;
    } else {
      host.innerHTML = state.roster.map(p=>`
        <div class="roster-chip">${escapeHtml(p.name)}<button data-del-player="${p.id}" title="Sil">✕</button></div>
      `).join("");
      host.querySelectorAll('[data-del-player]').forEach(b=>{
        b.addEventListener("click", ()=>{
          const id = b.dataset.delPlayer;
          if(confirm(`${escapeHtml(rosterName(id))} listeden silinsin mi?`)){
            state.roster = state.roster.filter(p=>p.id!==id);
            if(setupState) setupState.selected = setupState.selected.filter(x=>x!==id);
            saveState(); renderAll();
          }
        });
      });
    }
  }

  document.getElementById("addPlayerBtn").addEventListener("click", addPlayerFromInput);
  document.getElementById("newPlayerInput").addEventListener("keydown", e=>{ if(e.key==="Enter") addPlayerFromInput(); });
  function addPlayerFromInput(){
    const inp = document.getElementById("newPlayerInput");
    const name = inp.value.trim();
    if(!name) return;
    state.roster.push({id:uid(), name});
    inp.value = "";
    saveState(); renderAll();
    document.getElementById("newPlayerInput").focus();
  }

  // ==================================================
  // SETUP WIZARD ("Bugün kim oynuyor")
  // ==================================================
  let setupState = null; // {selected:[ids up to 4], karo2:null, seating:[ids in order]}

  function ensureSetupState(){
    if(!setupState) setupState = {selected:[], karo2:null, seating:[]};
  }

  function renderSetup(){
    const host = document.getElementById("setupHost");
    if(state.session){ host.innerHTML=""; return; }
    ensureSetupState();

    let html = `<div class="section-title"><span>Bugün Kim Oynuyor?</span><div class="rule"></div></div>`;
    html += `<div class="setup-card">`;

    // Step 1: pick 4 players
    html += `<div class="step-label">1. Masadaki 4 oyuncuyu seç (${setupState.selected.length}/4)</div><div class="choice-grid">`;
    if(state.roster.length===0){
      html += `<div class="setup-hint">Önce yukarıdan oyuncu ekle.</div>`;
    }
    state.roster.forEach(p=>{
      const sel = setupState.selected.includes(p.id);
      const disabled = !sel && setupState.selected.length>=4;
      html += `<button class="choice-btn ${sel?'selected':''}" data-step="select" data-val="${p.id}" ${disabled?'disabled':''}>${escapeHtml(p.name)}</button>`;
    });
    html += `</div>`;

    // Step 2: karo 2
    if(setupState.selected.length===4){
      html += `<div class="step-label">2. Karo 2 kimde?</div><div class="choice-grid">`;
      setupState.selected.forEach(id=>{
        const sel = setupState.karo2===id;
        html += `<button class="choice-btn ${sel?'selected':''}" data-step="karo2" data-val="${id}">${escapeHtml(rosterName(id))}</button>`;
      });
      html += `</div>`;
    }

    // Step 3: seating order
    if(setupState.selected.length===4 && setupState.karo2){
      html += `<div class="step-label">3. Oturma sırası (sırayla dokun)</div><div class="choice-grid">`;
      setupState.selected.forEach(id=>{
        const pos = setupState.seating.indexOf(id);
        html += `<button class="choice-btn seat-btn" data-step="seat" data-val="${id}">
          ${escapeHtml(rosterName(id))}${pos>=0?`<span class="seat-badge">${pos+1}</span>`:''}
        </button>`;
      });
      html += `</div>`;
      if(setupState.seating.length>0){
        html += `<div class="setup-hint"><button class="btn-secondary" id="resetSeating" style="padding:4px 10px;font-size:11px;margin-top:6px;">Sırayı sıfırla</button></div>`;
      }
    }

    const ready = setupState.selected.length===4 && setupState.karo2 && setupState.seating.length===4;
    html += `<div class="panel-actions">
      <button class="btn-primary" id="startSessionBtn" ${ready?'':'disabled'}>Oyunu Başlat</button>
    </div>`;
    html += `</div>`;

    host.innerHTML = html;

    host.querySelectorAll('[data-step="select"]').forEach(b=>b.addEventListener("click",()=>{
      const id = b.dataset.val;
      if(setupState.selected.includes(id)){
        setupState.selected = setupState.selected.filter(x=>x!==id);
        if(setupState.karo2===id) setupState.karo2=null;
        setupState.seating = setupState.seating.filter(x=>x!==id);
      } else if(setupState.selected.length<4){
        setupState.selected.push(id);
      }
      renderSetup();
    }));
    host.querySelectorAll('[data-step="karo2"]').forEach(b=>b.addEventListener("click",()=>{
      setupState.karo2 = b.dataset.val;
      setupState.seating = [];
      renderSetup();
    }));
    host.querySelectorAll('[data-step="seat"]').forEach(b=>b.addEventListener("click",()=>{
      const id = b.dataset.val;
      if(!setupState.seating.includes(id)) setupState.seating.push(id);
      renderSetup();
    }));
    const resetSeatBtn = document.getElementById("resetSeating");
    if(resetSeatBtn) resetSeatBtn.addEventListener("click", ()=>{ setupState.seating=[]; renderSetup(); });
    const startBtn = document.getElementById("startSessionBtn");
    if(startBtn) startBtn.addEventListener("click", startSession);
  }

  function startSession(){
    const {selected, karo2, seating} = setupState;
    if(selected.length!==4 || !karo2 || seating.length!==4) return;
    const players = selected.map(id=>rosterName(id));           // index 0..3
    const seatingIdx = seating.map(id=>selected.indexOf(id));    // seat order as player-indices
    const karo2Idx = selected.indexOf(karo2);
    const startPos = seatingIdx.indexOf(karo2Idx);
    // turnOrder: player-index sequence starting from karo2 holder, following seating order
    const turnOrder = [];
    for(let i=0;i<4;i++) turnOrder.push(seatingIdx[(startPos+i)%4]);

    state.session = {
      players,
      seatingIdx,
      karo2Idx,
      turnOrder,
      hands: []
    };
    setupState = null;
    saveState();
    renderAll();
  }

  function chooserForHandIndex(n){
    if(!state.session) return null;
    return state.session.turnOrder[n % 4];
  }

  // ==================================================
  // SESSION BAR
  // ==================================================
  function renderSessionBar(){
    const host = document.getElementById("sessionBarHost");
    if(!state.session){ host.innerHTML=""; return; }
    const s = state.session;
    const seatNames = s.seatingIdx.map(i=>s.players[i]).join(" → ");
    host.innerHTML = `<div class="session-bar">
      <span>Oturma sırası: <b>${escapeHtml(seatNames)}</b> — Karo 2: <b>${escapeHtml(s.players[s.karo2Idx])}</b></span>
      <button id="endSessionBtn">Yeni Oyun</button>
    </div>`;
    document.getElementById("endSessionBtn").addEventListener("click", ()=>{
      const msg = s.hands.length>0
        ? "Mevcut oyun (kaydedilen eller) silinip yeni oyun kurulumuna dönülecek. Emin misin?"
        : "Yeni oyun kurulumuna dön?";
      if(confirm(msg)){
        state.session = null;
        saveState(); renderAll();
      }
    });
  }

  // ==================================================
  // GAME (scoreboard, add hand, history, stats)
  // ==================================================
  function handScores(hand){
    if(hand.cancelled) return [0,0,0,0];
    const info = typeInfo(hand.type);
    const scores = [0,0,0,0];
    for(let p=0;p<4;p++){ scores[p] = (hand.counts[p]||0) * info.per; }
    return scores;
  }
  function validHandCount(){
    return state.session.hands.filter(h=>!h.cancelled).length;
  }
  function totals(){
    const t=[0,0,0,0];
    state.session.hands.forEach(h=>{ const s=handScores(h); for(let p=0;p<4;p++) t[p]+=s[p]; });
    return t;
  }
  function plusMinusTotals(){
    const pos=[0,0,0,0], neg=[0,0,0,0];
    state.session.hands.forEach(h=>{
      const sc = handScores(h);
      for(let p=0;p<4;p++){ if(sc[p]>0) pos[p]+=sc[p]; else if(sc[p]<0) neg[p]+=sc[p]; }
    });
    return {pos,neg};
  }
  function quotas(){
    const typePlayed={}; ALL_TYPES.forEach(t=>typePlayed[t.id]=0);
    const cezaByPlayer=[0,0,0,0], kozByPlayer=[0,0,0,0];
    state.session.hands.filter(h=>!h.cancelled).forEach(h=>{
      typePlayed[h.type]++;
      if(h.type==="koz") kozByPlayer[h.chooser]++; else cezaByPlayer[h.chooser]++;
    });
    return {typePlayed, cezaByPlayer, kozByPlayer};
  }

  function renderGame(){
    const host = document.getElementById("gameHost");
    if(!state.session){ host.innerHTML=""; scoreTableOpen=false; renderModal(); return; }
    host.innerHTML = `
      <div class="players-row" id="playersRow"></div>
      <button class="table-btn" id="scoreTableBtn">📊 Puan Tablosu</button>
      <div class="quota-title">İhale Durumu</div>
      <div class="quota-strip" id="quotaStrip"></div>
      <button class="add-btn" id="openPanelBtn">+ Yeni El Ekle</button>
      <div class="hand-progress" id="handProgress"></div>
      <div id="panelHost"></div>
      <div class="section-title"><span>El Geçmişi</span><div class="rule"></div></div>
      <div id="historyHost"></div>
      <footer>Veriler bu tarayıcıda saklanır (localStorage).
        <button id="resetAllBtn" style="background:none;border:none;color:var(--crimson-light);cursor:pointer;text-decoration:underline;font-size:11px;">Tüm verileri sıfırla</button>
      </footer>
    `;
    document.getElementById("openPanelBtn").addEventListener("click", ()=>{
      if(panelState){ panelState=null; } else { openPanel(); }
      renderPanel();
    });
    document.getElementById("scoreTableBtn").addEventListener("click", openScoreTable);
    document.getElementById("resetAllBtn").addEventListener("click", ()=>{
      if(confirm("Oyuncu listesi dahil TÜM veriler silinecek. Emin misin?")){
        state = defaultState(); setupState=null; panelState=null;
        saveState(); renderAll();
      }
    });
    renderPlayers();
    renderQuota();
    renderPanel();
    renderHistory();
    renderModal();
  }

  let showBreakdown = [false,false,false,false];
  function renderPlayers(){
    const s = state.session;
    const t = totals();
    const {pos,neg} = plusMinusTotals();
    const {cezaByPlayer, kozByPlayer} = quotas();
    const maxT = Math.max(...t);
    const row = document.getElementById("playersRow");
    const nextChooser = validHandCount() < TOTAL_HANDS ? chooserForHandIndex(validHandCount()) : null;
    row.innerHTML = s.players.map((name,i)=>{
      const totalHtml = showBreakdown[i]
        ? `<div class="player-total-split" data-toggle="${i}">
             <span class="plus">+${pos[i]}</span>
             <span class="minus">${neg[i]}</span>
           </div>`
        : `<div class="player-total ${t[i]<0?'neg':t[i]>0?'pos':''}" data-toggle="${i}">${t[i]}</div>`;
      const cezaLeft = CEZA_QUOTA_PER_PLAYER - cezaByPlayer[i];
      const kozLeft = KOZ_QUOTA_PER_PLAYER - kozByPlayer[i];
      return `<div class="player-card ${t[i]===maxT && maxT!==0 ? 'leader':''}">
        <div class="pname">${escapeHtml(name)}</div>
        ${totalHtml}
        <div class="player-rights">Ceza <b>${cezaLeft}</b> · Koz <b>${kozLeft}</b></div>
      </div>`;
    }).join("");
    row.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener("click", ()=>{
        const i = +el.dataset.toggle;
        showBreakdown[i] = !showBreakdown[i];
        renderPlayers();
      });
    });
    const progHost = document.getElementById("handProgress");
    const vhc = validHandCount();
    progHost.innerHTML = (vhc >= TOTAL_HANDS
      ? `Tüm eller tamamlandı (${vhc}/${TOTAL_HANDS})`
      : `El ${vhc}/${TOTAL_HANDS} — sırada: <b style="color:var(--gold-light)">${escapeHtml(s.players[nextChooser])}</b>`);
  }

  function openScoreTable(){ scoreTableOpen = true; renderModal(); }
  function closeScoreTable(){ scoreTableOpen = false; renderModal(); }
  let scoreTableOpen = false;
  function renderModal(){
    const host = document.getElementById("modalHost");
    if(!scoreTableOpen || !state.session){ host.innerHTML=""; return; }
    const s = state.session;
    const t = totals();
    let rowsHtml = "";
    s.hands.forEach((h,idx)=>{
      const info = typeInfo(h.type);
      const scores = handScores(h);
      rowsHtml += `<tr${h.cancelled?' style="opacity:0.55;"':''}><td>${idx+1}</td><td class="htype"><span class="hicon">${info.icon}</span> ${info.name}${h.cancelled?' <span class="cancel-tag">İPTAL</span>':''}</td>`;
      if(h.cancelled){
        rowsHtml += `<td class="zero" colspan="4">—</td>`;
      } else {
        scores.forEach(sc=>{
          const cls = sc<0?'neg':sc>0?'pos':'zero';
          rowsHtml += `<td class="${cls}">${sc>0?'+':''}${sc}</td>`;
        });
      }
      rowsHtml += `</tr>`;
    });
    const totalRow = `<tr class="total-row"><td colspan="2">Toplam</td>${t.map(v=>`<td class="${v<0?'neg':v>0?'pos':''}">${v}</td>`).join("")}</tr>`;
    host.innerHTML = `<div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-header"><h3>Puan Tablosu</h3><button id="closeModalBtn">✕</button></div>
        <div class="modal-body">
          ${s.hands.length===0 ? '<div class="empty-note">Henüz el eklenmedi.</div>' : `
          <table class="score-table">
            <thead><tr><th>El</th><th>İhale</th>${s.players.map(n=>`<th>${escapeHtml(n)}</th>`).join("")}</tr></thead>
            <tbody>${rowsHtml}${totalRow}</tbody>
          </table>`}
        </div>
      </div>
    </div>`;
    document.getElementById("closeModalBtn").addEventListener("click", closeScoreTable);
    document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeScoreTable(); });
  }

  function renderQuota(){
    const {typePlayed} = quotas();
    const strip = document.getElementById("quotaStrip");
    strip.innerHTML = ALL_TYPES.map(t=>{
      const max = t.id==="koz" ? 8 : 2;
      const played = typePlayed[t.id]||0;
      const kozCls = t.id==="koz" ? " koz-pill" : "";
      return `<div class="quota-pill${kozCls} ${played>=max?'done':''}"><span class="icon">${t.icon}</span> ${t.name} <b>${played}/${max}</b></div>`;
    }).join("");
  }

  // ---- Add hand panel ----
  let panelState = null; // {type, counts:[], rifkiWinner}
  function openPanel(){ panelState = {type:null, counts:[0,0,0,0], rifkiWinner:null}; }
  function closePanel(){ panelState=null; renderPanel(); }

  function renderPanel(){
    const host = document.getElementById("panelHost");
    if(!host) return;
    if(!panelState){ host.innerHTML = ""; return; }
    const s = state.session;
    const chooser = chooserForHandIndex(validHandCount());
    const {typePlayed, cezaByPlayer, kozByPlayer} = quotas();

    let html = `<div class="panel"><h3>Yeni El</h3>
      <div class="chooser-note">Bu eli oturma sırasına göre <b>${escapeHtml(s.players[chooser])}</b> seçiyor.</div>`;

    html += `<div class="step-label">1. İhale türü</div><div class="type-grid">`;
    ALL_TYPES.forEach(t=>{
      const max = t.id==="koz" ? 8 : 2;
      const played = typePlayed[t.id]||0;
      const personalUsed = t.id==="koz" ? kozByPlayer[chooser] : cezaByPlayer[chooser];
      const personalMax = t.id==="koz" ? KOZ_QUOTA_PER_PLAYER : CEZA_QUOTA_PER_PLAYER;
      const disabled = played>=max || personalUsed>=personalMax;
      const sel = panelState.type===t.id;
      const kozCls = t.id==="koz" ? " koz-pill" : "";
      html += `<button class="type-btn${kozCls} ${sel?'selected':''}" data-step="type" data-val="${t.id}" ${disabled?'disabled':''}>
        <span class="icon">${t.icon}</span> ${t.name} <small>${played}/${max}</small>
      </button>`;
    });
    html += `</div>`;

    if(panelState.type){
      const info = typeInfo(panelState.type);
      html += `<div class="step-label">2. Sonuç — ${info.name} (${info.units} ${info.unitLabel})</div>`;
      if(panelState.type==="rifki"){
        html += `<div class="rifki-grid">` + s.players.map((name,i)=>{
          const sel = panelState.rifkiWinner===i;
          return `<div class="rifki-btn ${sel?'selected':''}" data-step="rifki" data-val="${i}">${escapeHtml(name)}<br><small>kupa papazını aldı</small></div>`;
        }).join("") + `</div>`;
      } else {
        html += `<div class="dist-grid">` + s.players.map((name,i)=>`
          <div class="dist-cell"><label>${escapeHtml(name)}</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="${info.units}" placeholder="0" data-step="count" data-idx="${i}" value="${panelState.counts[i] ? panelState.counts[i] : ''}"/>
          </div>`).join("") + `</div>`;
        const sum = panelState.counts.reduce((a,b)=>a+(+b||0),0);
        const ok = sum===info.units;
        html += `<div class="dist-sum ${ok?'ok':'bad'}">Toplam: ${sum} / ${info.units} ${ok?'✓':''}</div>`;
      }
    }

    const canSubmit = isSubmittable();
    html += `<div class="panel-actions">
      <button class="btn-secondary" id="cancelPanel">Vazgeç</button>
      <button class="btn-primary" id="submitPanel" ${canSubmit?'':'disabled'}>Eli Kaydet</button>
    </div></div>`;

    host.innerHTML = html;

    host.querySelectorAll('[data-step="type"]').forEach(b=>b.addEventListener("click",()=>{
      panelState.type = b.dataset.val; panelState.counts=[0,0,0,0]; panelState.rifkiWinner=null; renderPanel();
    }));
    host.querySelectorAll('[data-step="rifki"]').forEach(b=>b.addEventListener("click",()=>{
      panelState.rifkiWinner = +b.dataset.val; renderPanel();
    }));
    host.querySelectorAll('[data-step="count"]').forEach(inp=>{
      inp.addEventListener("input",()=>{
        panelState.counts[+inp.dataset.idx] = Math.max(0, +inp.value||0);
        renderPanel();
        const again = host.querySelector(`[data-step="count"][data-idx="${inp.dataset.idx}"]`);
        if(again){ again.focus(); again.selectionStart = again.selectionEnd = again.value.length; }
      });
    });
    const cancelBtn = document.getElementById("cancelPanel");
    if(cancelBtn) cancelBtn.addEventListener("click", closePanel);
    const submitBtn = document.getElementById("submitPanel");
    if(submitBtn) submitBtn.addEventListener("click", submitHand);
  }

  function isSubmittable(){
    if(!panelState || !panelState.type) return false;
    const info = typeInfo(panelState.type);
    if(panelState.type==="rifki") return panelState.rifkiWinner!==null;
    const sum = panelState.counts.reduce((a,b)=>a+(+b||0),0);
    return sum===info.units;
  }

  function submitHand(){
    if(!isSubmittable()) return;
    const s = state.session;
    const chooser = chooserForHandIndex(validHandCount());
    const counts = panelState.type==="rifki"
      ? [0,1,2,3].map(i=> i===panelState.rifkiWinner?1:0)
      : panelState.counts.map(c=>+c||0);
    const cancelled = panelState.type==="kiz" && counts.every(c=>c===1);
    s.hands.push({ id: Date.now(), type: panelState.type, chooser, counts, cancelled });
    saveState();
    closePanel();
    renderGame();
  }

  // ---- History ----
  function renderHistory(){
    const host = document.getElementById("historyHost");
    const s = state.session;
    if(s.hands.length===0){
      host.innerHTML = `<div class="empty-note">Henüz el eklenmedi. Yukarıdan ilk eli ekleyerek başla.</div>`;
      return;
    }
    let html = "";
    s.hands.slice().reverse().forEach((h, ri)=>{
      const idx = s.hands.length - 1 - ri;
      const info = typeInfo(h.type);
      const scores = handScores(h);
      html += `<div class="hand-row ${h.type==='rifki'?'rifki-row':''} ${h.cancelled?'cancelled-row':''}">
        <div class="hand-row-top">
          <div class="hand-meta">
            <span class="hand-num">#${idx+1}</span>
            <span class="hand-type"><span>${info.icon}</span>${info.name}</span>
            <span class="hand-chooser">— ${escapeHtml(s.players[h.chooser])} seçti</span>
            ${h.cancelled?'<span class="cancel-tag">İPTAL</span>':''}
          </div>
          <div class="hand-actions"><button data-del="${idx}" title="Sil">✕</button></div>
        </div>
        <div class="hand-breakdown">
          ${[0,1,2,3].map(p=>`
            <div class="bd-cell">
              <span class="name">${escapeHtml(s.players[p])}</span>
              <span class="val">${h.counts[p]}</span>
              <span class="score ${h.cancelled?'zero':(scores[p]<0?'neg':scores[p]>0?'pos':'zero')}">${h.cancelled?'—':(scores[p]>0?'+':'')+scores[p]}</span>
            </div>`).join("")}
        </div>
        ${h.cancelled?`<div class="cancel-note">Herkes 1'er kız aldı — el iptal, ${escapeHtml(s.players[h.chooser])} yeniden kızsız seçecek.</div>`:''}
      </div>`;
    });
    host.innerHTML = html;
    host.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener("click", ()=>{
        const i = +b.dataset.del;
        if(confirm(`El #${i+1} silinsin mi?`)){
          s.hands.splice(i,1);
          saveState(); renderGame();
        }
      });
    });
  }

  // ==================================================
  function renderAll(){
    renderRoster();
    renderSetup();
    renderSessionBar();
    renderGame();
  }

  renderAll();
})();
</script>
</body>
</html>
